<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>蜜屿电竞幸运大转盘</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
        body{
            background:radial-gradient(ellipse at top,#3a1c5c 0%,#1a0a2e 50%,#0d0518 100%);
            display:flex;flex-direction:column;align-items:center;
            padding:20px 10px;color:#fff;min-height:100vh;
            overflow-x:hidden;position:relative;
        }
        /* 背景星光 */
        body::before{
            content:"";position:fixed;inset:0;pointer-events:none;
            background-image:
                radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,.6),transparent),
                radial-gradient(1px 1px at 60% 70%,rgba(255,215,0,.5),transparent),
                radial-gradient(1.5px 1.5px at 80% 20%,rgba(255,255,255,.4),transparent),
                radial-gradient(1px 1px at 40% 80%,rgba(255,215,0,.3),transparent),
                radial-gradient(2px 2px at 90% 50%,rgba(255,255,255,.3),transparent);
            animation:twinkle 4s ease-in-out infinite alternate;
        }
        @keyframes twinkle{from{opacity:.5}to{opacity:1}}

        h1{
            font-size:28px;margin-top:10px;
            background:linear-gradient(135deg,#ffd700,#ff6b9d,#ffd700);
            -webkit-background-clip:text;background-clip:text;
            -webkit-text-fill-color:transparent;
            text-shadow:0 0 30px rgba(255,215,0,.3);
            letter-spacing:2px;font-weight:900;
        }
        .subtitle{font-size:13px;color:#b8a4d4;margin-top:6px;letter-spacing:1px}

        .box{
            position:relative;margin-top:24px;
            width:min(88vw,380px);height:min(88vw,380px);
        }
        /* 转盘外圈光环 */
        .box::before{
            content:"";position:absolute;inset:-14px;border-radius:50%;
            background:conic-gradient(from 0deg,#ffd700,#ff6b9d,#7c4dff,#00e5ff,#ffd700);
            filter:blur(8px);opacity:.7;z-index:0;
            animation:rotateGlow 6s linear infinite;
        }
        @keyframes rotateGlow{to{transform:rotate(360deg)}}

        /* 外圈灯泡装饰 */
        .lights{
            position:absolute;inset:-8px;border-radius:50%;z-index:1;pointer-events:none;
        }
        .lights span{
            position:absolute;width:10px;height:10px;border-radius:50%;
            background:#ffd700;box-shadow:0 0 8px #ffd700,0 0 16px rgba(255,215,0,.6);
            animation:bulb 1s ease-in-out infinite alternate;
        }
        @keyframes bulb{
            from{background:#ffd700;box-shadow:0 0 8px #ffd700,0 0 16px rgba(255,215,0,.6)}
            to{background:#ff6b6b;box-shadow:0 0 8px #ff6b6b,0 0 16px rgba(255,107,107,.6)}
        }

        #wheel{
            width:100%;height:100%;border-radius:50%;
            transition:transform 4.5s cubic-bezier(0.17,0.67,0.12,0.99);
            position:relative;z-index:2;
            box-shadow:0 0 0 6px #2a1a4a,0 0 0 8px #ffd700,0 10px 40px rgba(0,0,0,.5);
        }

        /* 指针 */
        .pointer{
            position:absolute;top:-18px;left:50%;
            transform:translateX(-50%);z-index:10;
            width:44px;height:56px;
            filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));
        }
        .pointer::before{
            content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
            width:0;height:0;
            border-left:22px solid transparent;
            border-right:22px solid transparent;
            border-top:40px solid #ff3333;
        }
        .pointer::after{
            content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
            width:24px;height:24px;border-radius:50%;
            background:radial-gradient(circle at 35% 35%,#ff6666,#cc0000);
            box-shadow:0 0 10px rgba(255,51,51,.8),inset 0 -2px 4px rgba(0,0,0,.3);
        }

        /* 中心按钮 */
        .center-btn{
            position:absolute;top:50%;left:50%;
            transform:translate(-50%,-50%);z-index:5;
            width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;
            background:radial-gradient(circle at 35% 30%,#ff8a80,#e53935 60%,#b71c1c);
            color:#fff;font-size:16px;font-weight:900;letter-spacing:1px;
            box-shadow:0 4px 15px rgba(229,57,53,.5),inset 0 2px 4px rgba(255,255,255,.3),inset 0 -3px 6px rgba(0,0,0,.3);
            transition:transform .15s,box-shadow .15s;
        }
        .center-btn:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.08)}
        .center-btn:active:not(:disabled){transform:translate(-50%,-50%) scale(.95)}
        .center-btn:disabled{background:radial-gradient(circle at 35% 30%,#888,#555);cursor:not-allowed;box-shadow:none}

        #btn{
            margin-top:28px;padding:14px 50px;font-size:18px;
            border:none;border-radius:50px;cursor:pointer;font-weight:bold;
            background:linear-gradient(135deg,#ff6b9d,#c44dff,#7c4dff);
            color:white;letter-spacing:2px;
            box-shadow:0 6px 20px rgba(196,77,255,.4),inset 0 1px 2px rgba(255,255,255,.3);
            transition:transform .15s,box-shadow .15s;
        }
        #btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 25px rgba(196,77,255,.55)}
        #btn:active:not(:disabled){transform:translateY(0)}
        #btn:disabled{background:linear-gradient(135deg,#666,#444);cursor:not-allowed;box-shadow:none}

        .stats{
            margin-top:16px;display:flex;gap:24px;font-size:13px;color:#b8a4d4;
        }
        .stats span b{color:#ffd700;font-size:16px;margin:0 3px}

        #result{
            margin-top:16px;font-size:18px;height:28px;text-align:center;
            color:#ffd700;font-weight:bold;
            text-shadow:0 0 10px rgba(255,215,0,.5);
        }

        /* 中奖弹窗 */
        .modal-mask{
            position:fixed;inset:0;background:rgba(0,0,0,.7);
            display:none;align-items:center;justify-content:center;z-index:100;
            backdrop-filter:blur(4px);
        }
        .modal-mask.show{display:flex;animation:fadeIn .3s}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .modal{
            background:linear-gradient(160deg,#2a1a4a,#1a0a2e);
            border:2px solid #ffd700;border-radius:20px;
            padding:36px 40px;text-align:center;
            box-shadow:0 0 60px rgba(255,215,0,.3);
            animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
            max-width:85vw;
        }
        @keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
        .modal .emoji{font-size:56px;margin-bottom:10px;animation:bounce 1s infinite}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        .modal h2{
            font-size:22px;margin-bottom:8px;
            background:linear-gradient(135deg,#ffd700,#ff6b9d);
            -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
        }
        .modal .prize-name{font-size:26px;color:#fff;font-weight:900;margin:12px 0;word-break:break-all}
        .modal button{
            margin-top:16px;padding:10px 36px;border:none;border-radius:25px;
            background:linear-gradient(135deg,#ff6b9d,#7c4dff);color:#fff;
            font-size:15px;font-weight:bold;cursor:pointer;letter-spacing:1px;
        }

        /* 记录按钮 */
        .record-btn{
            margin-top:12px;padding:8px 28px;border:1px solid rgba(255,215,0,.4);
            border-radius:25px;background:transparent;color:#ffd700;
            font-size:13px;cursor:pointer;letter-spacing:1px;
            transition:all .2s;
        }
        .record-btn:hover{background:rgba(255,215,0,.12);border-color:#ffd700}

        /* 记录弹窗 */
        .record-modal{width:min(90vw,420px);max-height:80vh;display:flex;flex-direction:column}
        .record-modal h2{margin-bottom:12px}
        .record-summary{
            display:flex;justify-content:space-around;
            padding:12px 0;margin-bottom:12px;
            background:rgba(255,255,255,.05);border-radius:10px;
        }
        .record-summary div{text-align:center}
        .record-summary .num{font-size:22px;font-weight:900;color:#ffd700}
        .record-summary .label{font-size:11px;color:#b8a4d4;margin-top:2px}
        .record-list{
            flex:1;overflow-y:auto;max-height:45vh;
            border-top:1px solid rgba(255,255,255,.1);
            padding-top:8px;
        }
        .record-list::-webkit-scrollbar{width:4px}
        .record-list::-webkit-scrollbar-thumb{background:rgba(255,215,0,.3);border-radius:2px}
        .record-item{
            display:flex;justify-content:space-between;align-items:center;
            padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.06);
            font-size:14px;
        }
        .record-item:last-child{border-bottom:none}
        .record-item .prize{font-weight:bold}
        .record-item .prize.win{color:#ffd700}
        .record-item .prize.lose{color:#888}
        .record-item .time{font-size:11px;color:#888;margin-top:3px}
        .record-item .tag{
            font-size:11px;padding:2px 8px;border-radius:10px;font-weight:bold;
        }
        .record-item .tag.win{background:rgba(255,215,0,.15);color:#ffd700}
        .record-item .tag.lose{background:rgba(255,255,255,.08);color:#888}
        .record-empty{text-align:center;color:#666;padding:30px 0;font-size:14px}
        .record-actions{display:flex;gap:10px;margin-top:14px}
        .record-actions button{flex:1;margin-top:0;padding:9px 0;font-size:13px}
        .record-actions .clear-btn{background:linear-gradient(135deg,#666,#444)}
    </style>
</head>
<body>
    <h1>蜜屿电竞幸运大转盘</h1>
    <div class="subtitle">✨ 每日惊喜 · 好礼不停 ✨</div>

    <div class="box">
        <div class="lights" id="lights"></div>
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
        <button class="center-btn" id="centerBtn">开始<br>抽奖</button>
    </div>

    <button id="btn">开始抽奖</button>
    <button class="record-btn" id="recordBtn">📋 抽奖记录</button>

    <div class="stats">
        <span>已抽 <b id="totalCount">0</b> 次</span>
        <span>中奖 <b id="winCount">0</b> 次</span>
    </div>
    <div id="result"></div>

    <!-- 中奖弹窗 -->
    <div class="modal-mask" id="modalMask">
        <div class="modal">
            <div class="emoji" id="modalEmoji">🎉</div>
            <h2 id="modalTitle">恭喜中奖</h2>
            <div class="prize-name" id="modalPrize"></div>
            <button id="modalClose">太棒了</button>
        </div>
    </div>

    <!-- 抽奖记录弹窗 -->
    <div class="modal-mask" id="recordMask">
        <div class="modal record-modal">
            <h2>🎰 抽奖记录</h2>
            <div class="record-summary">
                <div><div class="num" id="recTotal">0</div><div class="label">总次数</div></div>
                <div><div class="num" id="recWin">0</div><div class="label">中奖数</div></div>
                <div><div class="num" id="recRate">0%</div><div class="label">中奖率</div></div>
            </div>
            <div class="record-list" id="recordList"></div>
            <div class="record-actions">
                <button class="clear-btn" id="clearRecord">清空记录</button>
                <button id="closeRecord">关闭</button>
            </div>
        </div>
    </div>

<script>
(function(){
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('btn');
    const centerBtn = document.getElementById('centerBtn');
    const resDom = document.getElementById('result');
    const totalCountDom = document.getElementById('totalCount');
    const winCountDom = document.getElementById('winCount');
    const modalMask = document.getElementById('modalMask');
    const modalPrize = document.getElementById('modalPrize');
    const modalTitle = document.getElementById('modalTitle');
    const modalEmoji = document.getElementById('modalEmoji');
    const modalClose = document.getElementById('modalClose');
    const recordBtn = document.getElementById('recordBtn');
    const recordMask = document.getElementById('recordMask');
    const recordList = document.getElementById('recordList');
    const recTotal = document.getElementById('recTotal');
    const recWin = document.getElementById('recWin');
    const recRate = document.getElementById('recRate');
    const clearRecord = document.getElementById('clearRecord');
    const closeRecord = document.getElementById('closeRecord');

    const STORAGE_KEY = 'miyu_lottery_records';

    let size = 0;
    let dpr = window.devicePixelRatio || 1;

    // ====== 奖品配置 weight权重越大概率越高 ======
    const prizes = [
        {text:"奶茶",          color:"#ff6b6b", weight:10,  isWin:true},
        {text:"商城皮肤任选",  color:"#4ecdc4", weight:1,  isWin:true},
        {text:"商城最新皮肤",      color:"#ffe66d", weight:9, isWin:false},
        {text:"新赛季战令",    color:"#95e1d3", weight:9, isWin:true},
        {text:"皮肤按键",  color:"#f38181", weight:9,  isWin:true},
        {text:"无双皮*",    color:"#aa96da", weight:0, isWin:true},
    ];

    // 统计
    let totalCount = 0, winCount = 0;

    // ====== 抽奖记录存储 ======
    function loadRecords(){
        try{
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }catch(e){ return []; }
    }
    function saveRecord(prizeText, isWin){
        const records = loadRecords();
        records.unshift({
            prize: prizeText,
            isWin: isWin,
            time: new Date().toLocaleString('zh-CN', {hour12:false})
        });
        // 最多保留200条
        if(records.length > 200) records.length = 200;
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }catch(e){}
    }
    function clearAllRecords(){
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    }
    function renderRecords(){
        const records = loadRecords();
        const total = records.length;
        const wins = records.filter(r=>r.isWin).length;
        recTotal.innerText = total;
        recWin.innerText = wins;
        recRate.innerText = total > 0 ? Math.round(wins/total*100) + '%' : '0%';

        if(total === 0){
            recordList.innerHTML = '<div class="record-empty">暂无抽奖记录</div>';
            return;
        }
        recordList.innerHTML = records.map(r=>`
            <div class="record-item">
                <div>
                    <div class="prize ${r.isWin?'win':'lose'}">${r.prize}</div>
                    <div class="time">${r.time}</div>
                </div>
                <span class="tag ${r.isWin?'win':'lose'}">${r.isWin?'中奖':'未中'}</span>
            </div>
        `).join('');
    }
    // 页面加载时恢复统计
    (function initStats(){
        const records = loadRecords();
        totalCount = records.length;
        winCount = records.filter(r=>r.isWin).length;
        totalCountDom.innerText = totalCount;
        winCountDom.innerText = winCount;
    })();

    // 生成外圈灯泡
    const lightsBox = document.getElementById('lights');
    const bulbCount = 16;
    for(let i=0;i<bulbCount;i++){
        const s = document.createElement('span');
        const angle = (i / bulbCount) * 360;
        const rad = angle * Math.PI / 180;
        const r = 50; // 百分比
        s.style.left = `calc(${50 + r*Math.cos(rad)}% - 5px)`;
        s.style.top  = `calc(${50 + r*Math.sin(rad)}% - 5px)`;
        s.style.animationDelay = (i * 0.12) + 's';
        lightsBox.appendChild(s);
    }

    // 权重随机算法
    function getPrizeByWeight(){
        const totalWeight = prizes.reduce((sum,item)=>sum+item.weight,0);
        if(totalWeight <= 0) return 0;
        let random = Math.random() * totalWeight;
        for(let i=0;i<prizes.length;i++){
            random -= prizes[i].weight;
            if(random <= 0) return i;
        }
        return 0;
    }

    const total = prizes.length;
    const anglePer = 360 / total;
    let rotateTotal = 0;
    let isRun = false;

    function drawWheel(){
        const cssSize = Math.min(window.innerWidth*0.88, 380);
        size = cssSize;
        canvas.style.width = cssSize + 'px';
        canvas.style.height = cssSize + 'px';
        canvas.width = cssSize * dpr;
        canvas.height = cssSize * dpr;
        ctx.setTransform(dpr,0,0,dpr,0,0);

        let startAngle = -90;
        const r = size/2;
        ctx.clearRect(0,0,size,size);

        for(let i=0;i<total;i++){
            // 扇形
            ctx.beginPath();
            ctx.moveTo(r,r);
            ctx.arc(r,r,r, startAngle*Math.PI/180, (startAngle+anglePer)*Math.PI/180);
            ctx.closePath();

            // 渐变填充
            const grad = ctx.createRadialGradient(r,r,r*0.1,r,r,r);
            grad.addColorStop(0, lightenColor(prizes[i].color, 20));
            grad.addColorStop(1, prizes[i].color);
            ctx.fillStyle = grad;
            ctx.fill();

            // 分隔线
            ctx.strokeStyle = "rgba(255,255,255,.85)";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 文字
            ctx.save();
            ctx.translate(r,r);
            ctx.rotate((startAngle + anglePer/2)*Math.PI/180);
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#1a1a2e";
            ctx.font = `bold ${Math.max(12, size/24)}px system-ui, sans-serif`;
            ctx.shadowColor = "rgba(255,255,255,.5)";
            ctx.shadowBlur = 2;
            ctx.fillText(prizes[i].text, r*0.88, 0);
            ctx.restore();

            startAngle += anglePer;
        }

        // 中心圆装饰
        ctx.beginPath();
        ctx.arc(r,r, size*0.11, 0, Math.PI*2);
        ctx.fillStyle = "#2a1a4a";
        ctx.fill();
        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // 颜色变亮工具
    function lightenColor(hex, percent){
        const num = parseInt(hex.replace('#',''),16);
        const r = Math.min(255, (num>>16) + percent);
        const g = Math.min(255, ((num>>8)&0x00FF) + percent);
        const b = Math.min(255, (num&0x0000FF) + percent);
        return `rgb(${r},${g},${b})`;
    }

    drawWheel();

    // 窗口变化重绘
    let resizeTimer;
    window.addEventListener('resize', ()=>{
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(drawWheel, 150);
    });

    function startSpin(){
        if(isRun) return;
        isRun = true;
        btn.disabled = true;
        centerBtn.disabled = true;
        resDom.innerText = "";

        const randomIndex = getPrizeByWeight();
        // 目标角度（从0位开始，让目标扇形中心对准顶部指针所需的模360角度）
        const targetMod = (360 - (randomIndex * anglePer + anglePer / 2)) % 360;
        // 当前已旋转的模360角度（修正负数）
        const currentMod = ((rotateTotal % 360) + 360) % 360;
        // 还需顺时针旋转多少度才能到达目标（0~360）
        const delta = (targetMod - currentMod + 360) % 360;
        // 总旋转 = 6圈打底 + 差值，保证每次都多转几圈再停
        const targetAngle = 360 * 6 + delta;
        rotateTotal += targetAngle;
        canvas.style.transform = `rotate(${rotateTotal}deg)`;

        // 用 transitionend 替代 setTimeout，更精准
        const onEnd = ()=>{
            canvas.removeEventListener('transitionend', onEnd);
            totalCount++;
            totalCountDom.innerText = totalCount;

            const prize = prizes[randomIndex];
            if(prize.isWin){
                winCount++;
                winCountDom.innerText = winCount;
                showModal(prize.text, true);
            }else{
                resDom.innerText = `恭喜中奖：${prize.text}，🎉`;
            }
            // 保存抽奖记录
            saveRecord(prize.text, prize.isWin);

            isRun = false;
            btn.disabled = false;
            centerBtn.disabled = false;
        };
        canvas.addEventListener('transitionend', onEnd);
    }

    function showModal(name, isWin){
        modalPrize.innerText = name;
        if(isWin){
            modalTitle.innerText = "恭喜中奖";
            modalEmoji.innerText = "🎉";
        }else{
            modalTitle.innerText = "恭喜中奖";
            modalEmoji.innerText = "🎉";
        }
        modalMask.classList.add('show');
    }

    btn.onclick = startSpin;
    centerBtn.onclick = startSpin;
    modalClose.onclick = ()=> modalMask.classList.remove('show');
    modalMask.onclick = (e)=>{ if(e.target === modalMask) modalMask.classList.remove('show'); };

    // 抽奖记录弹窗
    recordBtn.onclick = ()=>{ renderRecords(); recordMask.classList.add('show'); };
    closeRecord.onclick = ()=> recordMask.classList.remove('show');
    recordMask.onclick = (e)=>{ if(e.target === recordMask) recordMask.classList.remove('show'); };
    clearRecord.onclick = ()=>{
        if(confirm('确定要清空所有抽奖记录吗？此操作不可恢复。')){
            clearAllRecords();
            totalCount = 0; winCount = 0;
            totalCountDom.innerText = 0;
            winCountDom.innerText = 0;
            renderRecords();
        }
    };
})();
</script>
</body>
</html>
